<style>#splash{position:fixed;inset:0;z-index:200;overflow:hidden;background:#040C33;display:grid;place-items:center;transition:opacity .7s ease,visibility .7s,transform .7s cubic-bezier(.4,0,.2,1)}#splash.out{opacity:0;visibility:hidden;transform:scale(1.08)}
#splash:before{content:"";position:absolute;inset:-25%;background:radial-gradient(38% 34% at 28% 24%,rgba(44,107,255,.55),transparent 70%),radial-gradient(42% 38% at 78% 78%,rgba(122,60,255,.38),transparent 70%),radial-gradient(28% 26% at 74% 18%,rgba(255,194,26,.16),transparent 70%);animation:spaur 9s ease-in-out infinite alternate}
#splash:after{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff9,transparent),radial-gradient(1.5px 1.5px at 70% 22%,#fff8,transparent),radial-gradient(2px 2px at 82% 62%,#FFC21Aaa,transparent),radial-gradient(1.5px 1.5px at 30% 78%,#fff7,transparent),radial-gradient(1.5px 1.5px at 55% 88%,#fff6,transparent),radial-gradient(2px 2px at 12% 58%,#FFC21A88,transparent);animation:sptw 3.2s ease-in-out infinite}
.sp-in{position:relative;z-index:1;text-align:center;color:#fff;font-family:Sora,system-ui,sans-serif}
.sp-ring{width:132px;height:132px;margin:0 auto 26px;position:relative;display:grid;place-items:center}
.sp-ring:before{content:"";position:absolute;inset:0;border-radius:42px;background:conic-gradient(from 0deg,#FFC21A,#2C6BFF 35%,rgba(44,107,255,0) 62%,#FFC21A);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));border-radius:50%;animation:spro 2.4s linear infinite,spfade .6s ease-out both}
.sp-ring:after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(44,107,255,.45),transparent 68%);filter:blur(10px);animation:spgl 2.4s ease-in-out infinite;z-index:-1}
.sp-logo{width:100px;height:100px;border-radius:30px;position:relative;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12);animation:splg .9s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo img{width:100%;height:100%;display:block}
.sp-logo:after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:spsh 2.2s ease-in-out .9s infinite}
.sp-name{font-weight:800;font-size:32px;letter-spacing:-.035em;display:flex;justify-content:center}.sp-name b{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);animation:splt .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.55s + var(--i)*.07s)}.sp-name b.g{color:#FFC21A}
.sp-tag{margin-top:10px;font-size:12.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62);opacity:0;animation:spup .8s ease 1.15s both}
.sp-bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);margin:34px auto 0;overflow:hidden;opacity:0;animation:spup .6s ease 1s both}.sp-bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#FFC21A,#fff);transform:translateX(-100%);animation:spb 1.5s cubic-bezier(.5,0,.2,1) 1.05s both}
@keyframes spaur{to{transform:translate(4%,3%) rotate(8deg) scale(1.1)}}@keyframes sptw{50%{opacity:.35}}@keyframes spro{to{transform:rotate(360deg)}}@keyframes spfade{from{opacity:0}to{opacity:1}}@keyframes spgl{50%{opacity:.55;transform:scale(1.12)}}
@keyframes splg{0%{transform:scale(.4) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}@keyframes spsh{0%{left:-60%}60%,100%{left:140%}}
@keyframes splt{to{opacity:1;transform:none;filter:none}}@keyframes spup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes spb{to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash:before,#splash:after{animation-duration:.01s!important;animation-delay:0s!important}}</style>
