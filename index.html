<style>#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(600px 420px at 50% 32%,#1F5BFF66,transparent),linear-gradient(160deg,#04103F,#0B3BD6);display:grid;place-items:center;transition:opacity .5s,visibility .5s}#splash.out{opacity:0;visibility:hidden}.sp-in{text-align:center;color:#fff;font-family:Sora,system-ui,sans-serif}.sp-ring{width:104px;height:104px;margin:0 auto 20px;position:relative;display:grid;place-items:center}.sp-ring:before,.sp-ring:after{content:"";position:absolute;inset:0;border-radius:32px;border:2px solid rgba(255,255,255,.55);animation:spr 1.8s ease-out infinite}.sp-ring:after{animation-delay:.9s}.sp-ring img{width:84px;height:84px;border-radius:24px;animation:spf 1.6s ease-in-out infinite;box-shadow:0 16px 40px rgba(0,0,0,.35)}.sp-name{font-weight:800;font-size:27px;letter-spacing:-.03em}.sp-name span{color:#FFC21A}.sp-bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:22px auto 0;overflow:hidden}.sp-bar i{display:block;height:100%;width:40%;border-radius:2px;background:#FFC21A;animation:spb 1.2s ease-in-out infinite}@keyframes spr{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.55);opacity:0}}@keyframes spf{50%{transform:translateY(-6px)}}@keyframes spb{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}</style>
